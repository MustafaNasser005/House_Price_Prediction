<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>House Price Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      body {
        background-color: #2c3e50;
        color: #ecf0f1;
      }
      .card {
        border-radius: 10px;
        margin-top: 50px;
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
      }
      .card-header {
        background-color: #2980b9;
        color: white;
        text-align: center;
        padding: 20px;
        font-size: 24px;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
      }
      .form-control {
        border-radius: 8px;
        background-color: #34495e;
        color: #ecf0f1;
        border: 1px solid #2980b9;
        font-size: 16px;
      }
      .form-control:focus {
        border-color: #3498db;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
      }
      .btn-primary {
        background-color: #3498db;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        padding: 12px 20px;
        width: 100%;
        margin-top: 15px;
      }
      .btn-primary:hover {
        background-color: #2980b9;
        cursor: pointer;
      }
      .btn-primary:active {
        background-color: #1f6db7;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .col-md-6 {
        text-align: center;
      }
      h3 {
        color: #f39c12;
        font-size: 1.5em;
      }
      .selectpicker {
        border-radius: 8px;
        background-color: #34495e;
        color: #ecf0f1;
      }
      .selectpicker:focus {
        border-color: #3498db;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h1>Welcome To House Price Predictor</h1>
                    </div>
                    <div class="card-body">
                         <form method="post" accept-charset="utf-8" id="priceForm">
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label><b>Select The Location:</b></label>
                                    <select class="selectpicker form-control" id="location" name="location" required="1">
                                        {% for location in locations %}
                                            <option value="{{ location }}">{{ location }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6 form-group">
                                    <label><b>Enter BHK:</b></label>
                                    <input type="text" class="form-control" id="bhk" name="bhk" placeholder="Enter BHK">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label><b>Enter The Number of Bedrooms:</b></label>
                                    <input type="text" class="form-control" id="bath" name="bath" placeholder="Enter The Number of Bedrooms">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label><b>Enter Square Feet:</b></label>
                                    <input type="text" class="form-control" id="total_sqft" name="total_sqft" placeholder="Enter Square Feet">
                                </div>
                                <div class="col-md-12 form-group">
                                    <button class="btn btn-primary" type="submit">Predict Price</button>
                                </div>
                            </div>
                         </form>
                         <br>
                         <div class="col-md-12 text-center">
                            <h3><span id="Prediction"></span></h3>
                         </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('priceForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Don't submit the form normally
            send_data();
        });

        function send_data() {
            var fd = new FormData(document.querySelector('#priceForm'));

            var xhr = new XMLHttpRequest();

            xhr.open('post', '/predict', true);
            document.getElementById("Prediction").innerHTML = "Wait, Predicting Price.....";
            
            xhr.onreadystatechange = function () {
                if (xhr.readyState == XMLHttpRequest.DONE) {
                    var response = xhr.responseText;
                    // Ensure the value is always positive using Math.abs()
                    document.getElementById('Prediction').innerHTML = "Prediction: $ " + Math.abs(response);
                }
            };
            
            xhr.send(fd);
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
